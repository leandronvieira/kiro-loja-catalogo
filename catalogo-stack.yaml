AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Stack do serviço de catálogo (kiro-loja-catalogo).
  Define ECR, TaskDefinition ECS, Service ECS e ListenerRule no ALB.
  Importa recursos da fundação (foundation.yaml) via Fn::ImportValue.

Parameters:
  ProjectName:
    Type: String
    Default: kiro-loja
    Description: Nome do projeto (prefixo compartilhado com foundation.yaml)

  ImageTag:
    Type: String
    Default: latest
    Description: Tag da imagem Docker no ECR (normalmente SHA do commit)

Resources:
  # ===========================================================================
  # ECR — Repositório de imagens Docker
  # ===========================================================================
  CatalogoRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: !Sub "${ProjectName}-catalogo"
      ImageScanningConfiguration:
        ScanOnPush: true
      ImageTagMutability: IMMUTABLE
      Tags:
        - Key: Project
          Value: !Ref ProjectName

  # ===========================================================================
  # IAM — Role para ECS Task
  # Permissões: pull de imagem ECR, escrever logs CloudWatch, acesso a secrets
  # ===========================================================================

  # Trust policy para o serviço ECS
  EcsTaskExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ProjectName}-catalogo-ecs-task-exec-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
      Policies:
        - PolicyName: access-secrets
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # Acessar secret do master do Aurora (conexão ao banco)
              - Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                Resource:
                  - !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${ProjectName}-aurora-*"
              # Escrever logs no CloudWatch
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/ecs/${ProjectName}-catalogo*"

  # Task role (para a aplicação dentro do container)
  EcsTaskRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ProjectName}-catalogo-ecs-task-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole

  # ===========================================================================
  # CLOUDWATCH — Log group
  # ===========================================================================
  LogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/ecs/${ProjectName}-catalogo"
      RetentionInDays: 7

  # ===========================================================================
  # ECS — Task Definition
  # Define container, env vars, volumes, health check
  # ===========================================================================
  TaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub "${ProjectName}-catalogo"
      NetworkMode: awsvpc
      RequiresCompatibilities:
        - FARGATE
      Cpu: "256"
      Memory: "512"
      ExecutionRoleArn: !GetAtt EcsTaskExecutionRole.Arn
      TaskRoleArn: !GetAtt EcsTaskRole.Arn
      ContainerDefinitions:
        - Name: catalogo
          Image: !Sub "${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/${CatalogoRepository}:${ImageTag}"
          Essential: true
          PortMappings:
            - ContainerPort: 3000
              HostPort: 3000
              Protocol: tcp
          Environment:
            - Name: NODE_ENV
              Value: production
            - Name: PORT
              Value: "3000"
            # Aurora
            - Name: AURORA_HOST
              Value: !ImportValue !Sub "${ProjectName}-AuroraClusterEndpoint"
            - Name: AURORA_PORT
              Value: !ImportValue !Sub "${ProjectName}-AuroraPort"
            - Name: AURORA_DATABASE
              Value: !ImportValue !Sub "${ProjectName}-DatabaseName"
            - Name: AURORA_USER
              Value: catalogo
            # Valkey
            - Name: VALKEY_HOST
              Value: !ImportValue !Sub "${ProjectName}-ValkeyEndpoint"
            - Name: VALKEY_PORT
              Value: !ImportValue !Sub "${ProjectName}-ValkeyPort"
          Secrets:
            - Name: AURORA_PASSWORD
              ValueFrom: !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${ProjectName}-catalogo-aurora-password:password:"
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: ecs
          HealthCheck:
            Command:
              - CMD-SHELL
              - "curl -f http://localhost:3000/health || exit 1"
            Interval: 30
            Timeout: 5
            Retries: 3
            StartPeriod: 60

  # ===========================================================================
  # ECS — Service
  # Define desejo de tasks, load balancing, auto scaling
  # ===========================================================================
  Service:
    Type: AWS::ECS::Service
    DependsOn: ListenerRule
    Properties:
      ServiceName: !Sub "${ProjectName}-catalogo"
      Cluster: !ImportValue !Sub "${ProjectName}-EcsClusterName"
      TaskDefinition: !Ref TaskDefinition
      DesiredCount: 2
      LaunchType: FARGATE
      PlatformVersion: LATEST
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: DISABLED
          Subnets:
            - !ImportValue !Sub "${ProjectName}-PrivateSubnetA"
            - !ImportValue !Sub "${ProjectName}-PrivateSubnetB"
          SecurityGroups:
            - !ImportValue !Sub "${ProjectName}-EcsTasksSecurityGroupId"
      LoadBalancers:
        - ContainerName: catalogo
          ContainerPort: 3000
          TargetGroupArn: !Ref TargetGroup
      DeploymentConfiguration:
        MaximumPercent: 200
        MinimumHealthyPercent: 100
        DeploymentCircuitBreaker:
          Enable: true
          Rollback: true
      Tags:
        - Key: Project
          Value: !Ref ProjectName

  # ===========================================================================
  # ALB — Target Group
  # Grupo de destino para as tasks do serviço
  # ===========================================================================
  TargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: !Sub "${ProjectName}-catalogo"
      Port: 3000
      Protocol: HTTP
      TargetType: ip
      VpcId: !ImportValue !Sub "${ProjectName}-VpcId"
      HealthCheckEnabled: true
      HealthCheckPath: /health
      HealthCheckProtocol: HTTP
      HealthCheckIntervalSeconds: 30
      HealthCheckTimeoutSeconds: 5
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 2
      Matcher:
        HttpCode: "200"
      TargetGroupAttributes:
        - Key: deregistration_delay.timeout_seconds
          Value: "30"
        - Key: stickiness.enabled
          Value: "false"
      Tags:
        - Key: Project
          Value: !Ref ProjectName

  # ===========================================================================
  # ALB — Listener Rule
  # Roteia /api/catalogo/* para o target group deste serviço
  # Priority: 100-199 (faixa reservada para catálogo)
  # ===========================================================================
  ListenerRule:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Properties:
      ListenerArn: !ImportValue !Sub "${ProjectName}-AlbListenerArn"
      Priority: 100
      Conditions:
        - Field: path-pattern
          Values:
            - /api/catalogo/*
      Actions:
        - Type: forward
          TargetGroupArn: !Ref TargetGroup

  # ===========================================================================
  # AUTO SCALING (fase 1 — apenas desired count fixo; fase 7 adiciona scaling)
  # ===========================================================================
  # Placeholder para ScalingTarget / ScalingPolicy na Fase 7

# =============================================================================
# OUTPUTS
# =============================================================================
Outputs:
  EcrRepositoryUri:
    Description: URI do repositório ECR (usar no CodeBuild)
    Value: !GetAtt CatalogoRepository.RepositoryUri
    Export:
      Name: !Sub "${ProjectName}-catalogo-ecr-uri"

  ServiceArn:
    Description: ARN do serviço ECS
    Value: !Ref Service
    Export:
      Name: !Sub "${ProjectName}-catalogo-service-arn"

  TargetGroupArn:
    Description: ARN do target group
    Value: !Ref TargetGroup
    Export:
      Name: !Sub "${ProjectName}-catalogo-target-group-arn"
